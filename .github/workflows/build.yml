name: Build Multiplatform Desktop Apps

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            asset_name: LocalMusicAndVideo-macOS.zip
          - os: windows-latest
            asset_name: LocalMusicAndVideo-Windows.zip
          - os: ubuntu-latest
            asset_name: LocalMusicAndVideo-Linux.tar.gz

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev patchelf

      - name: Install Project Dependencies
        run: npm install

      - name: Build Desktop Application
        run: npm run build

      - name: Compress Build Artifacts (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          cd dist
          tar -czvf ../${{ matrix.asset_name }} *

      - name: Compress Build Artifacts (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Compress-Archive -Path dist\* -DestinationPath ${{ matrix.asset_name }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download All Artifactsgit add .github/workflows/build.yml
git commit -m "Add build.yml workflow for GitHub Actions"
git push origin main
git tag v1.0.1
git push origin v1.0.1
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}