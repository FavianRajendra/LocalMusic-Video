name: Build Multiplatform Native Installers & APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: macos
            asset_name: LocalMusicAndVideo-macOS.dmg
          - os: windows-latest
            platform: windows
            asset_name: LocalMusicAndVideo-Windows-Setup.exe
          - os: ubuntu-latest
            platform: linux
            asset_name: LocalMusicAndVideo-Linux.tar.gz
          - os: ubuntu-latest
            platform: android
            asset_name: LocalMusicAndVideo-Android.apk

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Python (Desktop Only)
        if: matrix.platform != 'android'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java (Android Only)
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install System Dependencies (Linux Desktop)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev patchelf

      - name: Install Project Dependencies
        run: npm install

      - name: Build Web Assets & Desktop Application
        if: matrix.platform != 'android'
        run: npm run build

      - name: Package macOS DMG
        if: matrix.platform == 'macos'
        run: |
          cd dist
          hdiutil create -volname "LocalMusicAndVideo" -srcfolder . -ov -format UDZO ../${{ matrix.asset_name }}

      - name: Package Windows Setup Wizard (Inno Setup)
        if: matrix.platform == 'windows'
        shell: powershell
        run: |
          $iss = @"
          [Setup]
          AppName=LocalMusicAndVideo
          AppVersion=1.0
          DefaultDirName={userappdata}\LocalMusicAndVideo
          OutputDir=.
          OutputBaseFilename=LocalMusicAndVideo-Windows-Setup
          Compression=lzma
          SolidCompression=yes
          PrivilegesRequired=lowest
          SetupIconFile=compiler:SetupClassicIcon.ico
          
          [Tasks]
          Name: "desktopicon"; Description: "Create a desktop shortcut"; GroupDescription: "Additional icons:"

          [Files]
          Source: "dist\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{userdesktop}\LocalMusicAndVideo"; Filename: "{app}\LocalMusicAndVideo.exe"; Tasks: desktopicon
          Name: "{userprograms}\LocalMusicAndVideo"; Filename: "{app}\LocalMusicAndVideo.exe"
          
          [Run]
          Filename: "{app}\LocalMusicAndVideo.exe"; Description: "Launch LocalMusicAndVideo"; Flags: nowait postinstall skipifsilent
          "@
          $iss | Out-File -FilePath installer.iss -Encoding utf8
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Package Linux Archive
        if: matrix.platform == 'linux'
        run: |
          cd dist
          tar -czvf ../${{ matrix.asset_name }} *

      - name: Build Android APK (Capacitor)
        if: matrix.platform == 'android'
        run: |
          npm run build
          npx cap sync android
          cd android
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../${{ matrix.asset_name }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: "artifacts/**/*"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}